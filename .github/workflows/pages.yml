  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install dependencies
    run: |
      if [ -f package-lock.json ]; then npm ci; else npm install; fi

  - name: Build site (try npm build, then lovable)
    id: build
    run: |
      set -e
      # Try npm run build (if present)
      if npm run | grep -q " build"; then
        echo "Running: npm run build"
        npm run build
      else
        echo "No npm build script found, trying npx lovable build"
        npx --yes lovable build || (echo "npx lovable build failed; trying global lovable" && npm i -g lovable && lovable build)
      fi

  - name: Detect publish directory
    id: detect
    run: |
      set -e
      for d in dist build public out docs; do
        if [ -d "$d" ] && [ "$(ls -A $d)" ]; then
          echo "publish_dir=$d" >> $GITHUB_OUTPUT
          echo "Detected publish dir: $d"
          exit 0
        fi
      done
      echo "No output directory detected (tried: dist build public out docs)"; exit 1

  - name: Deploy to gh-pages
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ${{ steps.detect.outputs.publish_dir }}
